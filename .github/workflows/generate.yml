name: Generate articles

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs
    inputs:
      since:
        description: "Backfill: cover everything published since this date (YYYY-MM-DD). Leave empty for the normal daily run."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SINCE: ${{ inputs.since }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write articles with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$SINCE" ]; then
            python scripts/generate_articles.py --since "$SINCE"
          else
            python scripts/generate_articles.py
          fi

      - name: Validate
        run: python scripts/validate_posts.py

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A personal access token (secret PR_TOKEN) lets the PR trigger the
          # "Check posts" workflow; the default token cannot trigger workflows.
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ${{ inputs.since && format('articles/backfill-{0}', steps.date.outputs.today) || format('articles/{0}', steps.date.outputs.today) }}
          commit-message: "New articles for ${{ steps.date.outputs.today }}"
          title: ${{ inputs.since && format('📚 Backfill articles since {0}', inputs.since) || format('📰 New articles — {0}', steps.date.outputs.today) }}
          body: |
            Automatically generated briefs from nuclear-sector feeds.

            **Review checklist**
            - [ ] Facts match the linked sources
            - [ ] No copied sentences or long quotes
            - [ ] Headlines and categories make sense

            Edit files directly in this PR if something needs fixing, delete any
            article you don't want, then merge to publish.
          labels: articles
          add-paths: |
            _posts/*.md
            _data/seen.json
          delete-branch: true
