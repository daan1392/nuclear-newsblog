name: Generate articles

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write articles with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_articles.py

      - name: Validate
        run: python scripts/validate_posts.py

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A personal access token (secret PR_TOKEN) lets the PR trigger the
          # "Check posts" workflow; the default token cannot trigger workflows.
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: articles/${{ steps.date.outputs.today }}
          commit-message: "New articles for ${{ steps.date.outputs.today }}"
          title: "📰 New articles — ${{ steps.date.outputs.today }}"
          body: |
            Automatically generated briefs from today's nuclear-sector feeds.

            **Review checklist**
            - [ ] Facts match the linked sources
            - [ ] No copied sentences or long quotes
            - [ ] Headlines and categories make sense

            Edit files directly in this PR if something needs fixing, delete any
            article you don't want, then merge to publish.
          labels: articles
          add-paths: |
            _posts/*.md
            _data/seen.json
          delete-branch: true
