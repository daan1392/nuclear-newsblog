name: Update events

on:
  schedule:
    - cron: "43 6 * * 1"   # weekly, Mondays 06:43 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Extract events with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_events.py 2>&1 | tee events.log

      - name: Validate
        run: python scripts/validate_events.py

      - name: Summary
        if: always()
        run: |
          {
            echo "### Events run"
            echo '```'
            grep -E "characters|warning|note:|^\+|new event|tokens" events.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Today's date
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: events/${{ steps.date.outputs.today }}
          commit-message: "Update events ${{ steps.date.outputs.today }}"
          title: "📅 Events update — ${{ steps.date.outputs.today }}"
          body: |
            Automatically extracted events (conferences, schools, trainings, lectures,
            technical visits, contests, social) from the organisers' pages.

            **Review checklist**
            - [ ] Dates, places and links match the organiser's page
            - [ ] Country codes are right
            - [ ] Nothing that isn't really an event

            Edit `_data/events.json` in this PR to fix or remove entries, then merge to publish.
          labels: events
          add-paths: |
            _data/events.json
          delete-branch: true

      # Opt-in: set the repository variable AUTO_MERGE_EVENTS to "true" to merge
      # event PRs automatically once validation has passed. Off by default so a
      # human still reviews what the model extracted.
      - name: Auto-merge (if enabled)
        if: vars.AUTO_MERGE_EVENTS == 'true' && steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --squash --delete-branch
